[project]
name = "lunar-listings"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy", "numba", "rasterio", "scipy", "pandas", "requests", "pyyaml", "pillow"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lunar_listings*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
